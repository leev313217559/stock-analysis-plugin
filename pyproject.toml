[project]
name = "stock-analysis-tools"
version = "0.2.11"
description = "Stock analysis tools for the dsh plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "dsh-plugin",
    "ai-agent",
    "stock",
    "stock-analysis",
    "stock-market",
    "stock-screener",
    "backtest",
    "backtesting",
    "quantitative-finance",
    "quantitative-trading",
    "algorithmic-trading",
    "technical-analysis",
    "factor-investing",
    "a-shares",
    "hk-stocks",
    "us-stocks",
    "akshare",
    "yfinance",
    "tushare",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "akshare>=1.20.24; python_version >= '3.11'",
    "akshare>=1.14.0; python_version < '3.11'",
    "yfinance>=0.2.36",
    "pandas>=2.0.0,<4",
    "numpy>=1.24.0",
    "pypinyin>=0.50.0",
    "pypdf>=5.0.0",
    "requests>=2.33.0",
    "newspaper4k>=0.9.6.1",
    "efinance>=0.5.0",
    "longport>=1.0.0",
    "finnhub-python>=2.4.0",
    "jinja2>=3.1.6",
    "exchange-calendars>=4.5.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Weaxs/stock-analysis-plugin"
Repository = "https://github.com/Weaxs/stock-analysis-plugin"
Issues = "https://github.com/Weaxs/stock-analysis-plugin/issues"

[tool.coverage.run]
# Most CLI paths are exercised through subprocess; measure those children too.
patch = ["subprocess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration_network and not integration_llm'"
markers = [
    "integration_network: real provider calls (akshare/yfinance/etc.) — needs network",
    "integration_llm: real LLM calls (DeepSeek/Anthropic) — needs API key and network",
]
