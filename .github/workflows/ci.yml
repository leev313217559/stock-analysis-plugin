# dsh-only CI: Python core + dsh adapter/dashboard + dsh host smoke.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python lint tools
        run: pip install ruff==0.15.20

      - name: Ruff check
        run: ruff check tools/ skills/ tests/

      - name: Ruff format check
        run: ruff format --check tools/ skills/ tests/

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=tools --cov-report=term-missing

  network:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r requirements-dev.txt

      - name: Network integration tests
        run: pytest tests/e2e/test_provider_network.py -m integration_network -v

  compat:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Python setup failure check
        run: node tests/test_setup_python.mjs

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r requirements-dev.txt
          npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: dsh plugin registration
        run: npx tsx tests/test_dsh_integration.ts

      - name: dsh tool discovery
        run: npx tsx tests/test_dsh_discovery.ts

      - name: dsh dashboard and watchlist regressions
        run: npx tsx tests/test_dsh_dashboard.ts

      - name: dsh browser poll regression
        run: npx tsx tests/test_dsh_web_poll.ts

      - name: Large JSON input transport and cleanup
        run: npx tsx tests/test_json_input.ts

      - name: JS host process-tree cancellation
        run: npx tsx tests/test_process_tree.ts

      - name: dsh host real subprocess round-trip
        run: npx tsx tests/e2e/test_dsh_e2e.ts

  e2e-llm:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Resolve model endpoint on runner
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
        run: node scripts/ci-resolve-llm-host.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: E2E — dsh LLM flow
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
        run: |
          if [ -z "$OPENAI_BASE_URL" ] || [ -z "$OPENAI_API_KEY" ] || [ -z "$OPENAI_MODEL" ]; then
            echo "OPENAI_BASE_URL, OPENAI_API_KEY, and OPENAI_MODEL are required — skipping LLM e2e"
            exit 0
          fi
          npx tsx tests/e2e/test_host_llm.ts dsh

  e2e-host:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Resolve model endpoint on runner
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
        run: node scripts/ci-resolve-llm-host.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Install dsh CLI and package manager
        run: npm i -g @deepseek-ai/dsh@0.2.2-rc.1 pnpm@10

      - name: dsh research presets and persistent runtime (offline)
        run: |
          npm run build:dsh
          node tests/e2e/test_dsh_research.mjs "$(npm root -g)/@deepseek-ai/dsh"

      - name: Real-host smoke QA (dsh)
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
        run: |
          if [ -z "$OPENAI_BASE_URL" ] || [ -z "$OPENAI_API_KEY" ] || [ -z "$OPENAI_MODEL" ]; then
            echo "OPENAI_BASE_URL, OPENAI_API_KEY, and OPENAI_MODEL are required — skipping real-host e2e"
            exit 0
          fi
          node tests/e2e/host_smoke.mjs dsh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, compat]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Build dsh bundle
        run: npm run build:dsh

      - name: Stage payload into dsh/
        run: |
          set -euo pipefail
          for d in tools skills schemas templates strategies scripts; do
            rm -rf "dsh/$d"
            cp -R "$d" "dsh/$d"
          done
          rm -f dsh/scripts/sync-version.sh
          cp LICENSE dsh/LICENSE

      - name: Verify dsh pack contents
        working-directory: dsh
        run: npm pack --dry-run

      - name: Pack dsh bundle
        working-directory: dsh
        run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-package-tarball
          path: dsh/*.tgz
          retention-days: 7
