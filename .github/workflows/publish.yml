name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish-dsh:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build compiled plugin entry (dist/index.js)
        run: npm run build:dsh

      - name: Stage payload into dsh/
        run: |
          set -euo pipefail
          for d in tools skills schemas templates strategies scripts; do
            if [ -d "$d" ]; then
              rm -rf "dsh/$d"
              cp -R "$d" "dsh/$d"
            fi
          done
          rm -f dsh/scripts/sync-version.sh
          cp LICENSE dsh/LICENSE

      - name: Verify compiled entry and patch are packaged
        working-directory: dsh
        run: |
          npm pack --dry-run 2>&1 | tee pack-dry-run.txt
          grep -q "dist/index.js" pack-dry-run.txt \
            || { echo "::error::dist/index.js missing from dsh npm tarball"; exit 1; }
          grep -q "cordis.patch.yml" pack-dry-run.txt \
            || { echo "::error::cordis.patch.yml missing from dsh npm tarball"; exit 1; }
          for file in dist/research-role.js dist/client.js dist/web/index.html dist/web/app.js dist/web/style.css research.patch.yml deepseek-search.patch.yml; do
            grep -q "$file" pack-dry-run.txt || { echo "::error::$file missing from dsh npm tarball"; exit 1; }
          done
          grep -q "LICENSE" pack-dry-run.txt || { echo "::error::LICENSE missing from dsh npm tarball"; exit 1; }

      - name: npm publish
        working-directory: dsh
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish unscoped variant to npm
        working-directory: dsh
        run: |
          PKG="$(node -p "require('./package.json').name")"
          npm pkg set name=dsh-stock-analysis
          sed -i "s|$PKG|dsh-stock-analysis|g" cordis.patch.yml research.patch.yml dist/client.js
          grep -q 'name: "dsh-stock-analysis"' cordis.patch.yml
          grep -q 'id: "dsh-stock-analysis"' dist/client.js
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-dsh]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compose install footer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > install_footer.md <<EOF

          ---
          ### Install

          - **dsh**: \`dsh plugin --profile <name> add dsh-stock-analysis@${VERSION}\`
          - scoped variant: \`@leev313217559/dsh-stock-analysis\`
          EOF

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
          GENERATED=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          {
            echo "$GENERATED"
            cat install_footer.md
          } > final_notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file final_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
